<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#172744"/></linearGradient></defs><rect width="1920" height="960" fill="url(#bg)"/><rect x="100" y="92" width="72" height="6" rx="3" fill="#5EEAD4"/><text x="100" y="205" font-family="Segoe UI" font-size="68" font-weight="700" fill="#FFFFFF">Set up once. Control locally.</text><text x="104" y="280" font-family="Segoe UI" font-size="34" font-weight="400" fill="#E2E8F0">No Teams OAuth or app registration.</text><rect x="100" y="370" width="550" height="330" rx="24" fill="#101827" stroke="#334155"/><text x="132" y="435" font-family="Segoe UI" font-size="38" font-weight="700" fill="#5EEAD4">1</text><text x="132" y="505" font-family="Segoe UI" font-size="32" font-weight="600" fill="#FFFFFF">Install the runtime</text><text x="132" y="570" font-family="Segoe UI" font-size="27" font-weight="400" fill="#E2E8F0">.NET 10 Desktop Runtime</text><text x="132" y="625" font-family="Segoe UI" font-size="21" font-weight="400" fill="#94A3B8">Windows x64 · installed separately</text><rect x="685" y="370" width="550" height="330" rx="24" fill="#101827" stroke="#334155"/><text x="717" y="435" font-family="Segoe UI" font-size="38" font-weight="700" fill="#5EEAD4">2</text><text x="717" y="505" font-family="Segoe UI" font-size="32" font-weight="600" fill="#FFFFFF">Add four actions</text><text x="717" y="570" font-family="Segoe UI" font-size="27" font-weight="400" fill="#E2E8F0">Stream Deck 7.1 or later</text><text x="717" y="625" font-family="Segoe UI" font-size="21" font-weight="400" fill="#94A3B8">Microphone · Camera · Share · Leave</text><rect x="1270" y="370" width="550" height="330" rx="24" fill="#101827" stroke="#334155"/><text x="1302" y="435" font-family="Segoe UI" font-size="38" font-weight="700" fill="#5EEAD4">3</text><text x="1302" y="505" font-family="Segoe UI" font-size="32" font-weight="600" fill="#FFFFFF">Join a Teams meeting</text><text x="1302" y="570" font-family="Segoe UI" font-size="27" font-weight="400" fill="#E2E8F0">Desktop Teams on Windows 11</text><text x="1302" y="625" font-family="Segoe UI" font-size="21" font-weight="400" fill="#94A3B8">Japanese interface · Personal accounts tested</text><text x="104" y="800" font-family="Segoe UI" font-size="28" font-weight="400" fill="#94A3B8">Teams may briefly come forward during mic or camera actions.</text><text x="100" y="906" font-family="Segoe UI" font-size="24" font-weight="400" fill="#94A3B8">Independent integration  |  Windows x64  |  Key previews from plugin artwork</text></svg>